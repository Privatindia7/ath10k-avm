# Parameter der gepatchten ath10k-Module fuer den FRITZ!WLAN USB Stick AC 430 (057c:8602)
# ack_thin=2 ack_thin_pending=8: bei Rueckstau nur jedes 2. reine TCP-ACK (ohne SACK, keine Duplikate) senden;
# hebt den TCP-Download von ~30 auf ~44 Mbit/s (die FW sendet TX-Frames unaggregiert). Aus: ack_thin=0.
options ath10k_core ack_thin=2 ack_thin_pending=8
