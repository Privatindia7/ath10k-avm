# NetworkManager-Einstellungen fuer den FRITZ!WLAN AC 430 (ath10k-avm-Treiber).
# Der Stick wird bei jedem "down" resettet und neu enumeriert; MAC-Wechsel und
# Scan-Randomisierung wuerden zusaetzliche Down/Up-Zyklen ausloesen.
# install.sh ersetzt @MAC@ durch die MAC des Sticks.
[device-avm-fritz]
match-device=mac:@MAC@
wifi.scan-rand-mac-address=no

[connection-avm-fritz]
match-device=mac:@MAC@
wifi.cloned-mac-address=permanent
